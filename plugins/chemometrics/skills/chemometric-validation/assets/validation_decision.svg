<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .q { fill: #fff6e6; stroke: #c99a3a; stroke-width: 1.5; }
    .step { fill: #e7f0e9; stroke: #4a8c5f; stroke-width: 1.5; }
    .t { fill: #1a1a1a; } .lbl { fill: #555; font-size: 11px; font-style: italic; }
    .edge { stroke: #8a9aa8; stroke-width: 1.3; fill: none; }
    @media (prefers-color-scheme: dark) {
      .q { fill: #3a3020; stroke: #d9b866; } .step { fill: #22362a; stroke: #6fbf87; }
      .t { fill: #e8e8e8; } .lbl { fill: #aaa; } .edge { stroke: #6a7a88; }
    }
  </style>
  <text x="400" y="26" text-anchor="middle" class="t" font-size="16" font-weight="bold">Validating a chemometric model</text>

  <rect class="step" x="230" y="44" width="340" height="34" rx="6"/>
  <text x="400" y="66" text-anchor="middle" class="t">Put preprocessing + model in ONE Pipeline</text>

  <rect class="q" x="250" y="98" width="300" height="46" rx="6"/>
  <text x="400" y="118" text-anchor="middle" class="t">Replicate / augmented copies</text>
  <text x="400" y="134" text-anchor="middle" class="t">of one physical sample?</text>
  <path class="edge" d="M400 78 V98"/>

  <path class="edge" d="M250 121 H110 V156"/>
  <text x="180" y="116" text-anchor="middle" class="lbl">yes</text>
  <rect class="step" x="20" y="156" width="180" height="34" rx="6"/>
  <text x="110" y="178" text-anchor="middle" class="t">GroupKFold(groups)</text>

  <path class="edge" d="M550 121 H690 V156"/>
  <text x="620" y="116" text-anchor="middle" class="lbl">no</text>
  <rect class="step" x="600" y="156" width="190" height="34" rx="6"/>
  <text x="695" y="177" text-anchor="middle" class="t">Stratified (class) /</text>
  <text x="695" y="205" text-anchor="middle" class="lbl">plain KFold (regression)</text>

  <rect class="step" x="220" y="228" width="360" height="34" rx="6"/>
  <text x="400" y="250" text-anchor="middle" class="t">cross_validate the pipeline — refits per fold, no leakage</text>
  <path class="edge" d="M110 190 V245 H220"/>
  <path class="edge" d="M695 205 V245 H580"/>

  <rect class="step" x="220" y="276" width="360" height="34" rx="6"/>
  <text x="400" y="298" text-anchor="middle" class="t">Report RMSEP · R² · RPD · bias  /  acc · F1 · confusion</text>
  <path class="edge" d="M400 262 V276"/>

  <rect class="q" x="250" y="324" width="300" height="34" rx="6"/>
  <text x="400" y="346" text-anchor="middle" class="t">n small vs #bands? → permutation test</text>
  <path class="edge" d="M400 310 V324"/>

  <text x="400" y="386" text-anchor="middle" class="lbl" font-size="13" font-weight="bold">Ungrouped CV on replicates leaks — grouped CV is the honest estimate.</text>
  <text x="400" y="408" text-anchor="middle" class="lbl">CV chooses hyperparameters; an untouched test set (RMSEP) confirms them.</text>
  <text x="400" y="430" text-anchor="middle" class="lbl">cross_validate.py · metrics.py · permutation_test.py  →  then model-diagnostics (applicability domain)</text>
</svg>
